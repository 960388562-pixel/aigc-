<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>赵健翔 — AI Visual Designer</title>
  <meta name="description" content="赵健翔，AI 视觉设计师。让想象成为可被看见的现实。" />
  <meta name="theme-color" content="#000" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='44' font-family='Arial Black' font-size='32' fill='%23fff' text-anchor='middle'%3EZ%3C/text%3E%3C/svg%3E" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden;background:#000;cursor:none}
    body{font-family:-apple-system,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;color:#fff;position:relative}
    a{cursor:none}

    .gradient-ascii-bg{
      position:fixed;inset:0;z-index:0;overflow:hidden;
      pointer-events:none;background:#000;
    }
    .gradient-ascii-container{position:relative;width:100%;height:100%;overflow:hidden}
    .gradient-ascii-canvas{position:absolute;inset:0;display:block;width:100%;height:100%}

    .home-reveal{
      position:fixed;inset:0;z-index:0;
    }

    .stroke-text-wrap{
      position:fixed;inset:0;z-index:2;display:grid;place-items:center;
      pointer-events:none;padding:0 24px;
    }
    .stroke-text-wrap::before{
      content:"";position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(ellipse 46% 30% at 50% 50%,rgba(0,0,0,.42),transparent 74%);
    }
    .stroke-text-wrap .stroke-text{pointer-events:auto;cursor:none}
    .stroke-text{
      position:relative;z-index:1;display:block;
      width:min(100%,var(--stroke-text-width,600px));line-height:0;
    }
    .stroke-text__svg{
      display:block;width:100%;max-width:var(--stroke-text-width,600px);
      height:auto;margin:0 auto;overflow:visible;
    }
    .stroke-text__stroke,.stroke-text__fill{user-select:none}

    .tagline{
      position:fixed;left:50%;bottom:64px;z-index:10;
      display:flex;flex-direction:column;align-items:center;
      width:min(560px,calc(100vw - 48px));max-width:none;
      text-align:center;translate:-50% 0;
      animation:fadeIn 1s ease .3s both;
    }
    .tagline__title{
      font-size:clamp(12px,1.05vw,14px);font-weight:300;
      line-height:1.7;letter-spacing:.16em;color:#fff;
      font-family:"Segoe UI Light","Segoe UI","Helvetica Neue",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .tagline__meta{
      margin-top:10px;font-size:10px;font-weight:400;
      line-height:1.6;letter-spacing:.14em;color:rgba(255,255,255,.5);
    }
    .tagline .btn-pill{margin-top:18px}

    .btn-pill{
      display:inline-flex;align-items:center;gap:10px;margin-top:20px;
      padding:14px 28px;background:#fff;color:#000;border-radius:100px;
      font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
      border:0;font-family:inherit;cursor:none;appearance:none;
      transition:transform .3s,box-shadow .3s;animation:fadeIn 1s ease .6s both;
    }
    .btn-pill:hover{transform:scale(1.04);box-shadow:0 0 40px rgba(200,255,0,.3)}
    .btn-pill .arrow{transition:transform .3s}
    .btn-pill:hover .arrow{transform:translateX(4px)}

    .menu{position:fixed;top:28px;right:28px;z-index:10;display:grid;grid-template-columns:repeat(2,5px);gap:3px;animation:fadeIn 1s ease .3s both}
    .menu i{width:5px;height:5px;background:#fff;border-radius:1px}

    .bl{position:fixed;bottom:24px;left:28px;z-index:10;font-size:12px;font-weight:600;animation:fadeIn 1s ease .8s both}
    .br{position:fixed;bottom:24px;right:28px;z-index:10;display:flex;align-items:center;gap:16px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;animation:fadeIn 1s ease .8s both}
    .br .lang{border:1px solid rgba(255,255,255,.3);padding:4px 10px;border-radius:4px}

    .cursor-big{
      position:fixed;width:80px;height:80px;border:1.5px solid rgba(255,255,255,.6);
      border-radius:50%;pointer-events:none;z-index:999;transform:translate(-50%,-50%);
      transition:width .3s,height .3s,border-color .3s,background .3s;display:grid;place-items:center;
    }
    .cursor-big::after{content:'';width:6px;height:6px;background:#fff;border-radius:50%}
    .cursor-big.hover{width:120px;height:120px;border-color:rgba(200,255,0,.8);background:rgba(200,255,0,.08)}

    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

    @media (max-width:768px){
      .tagline{left:50%;bottom:88px;width:calc(100vw - 48px)}
      .tagline__title{font-size:11px;letter-spacing:.12em;line-height:1.7}
      .tagline__meta{font-size:9px;letter-spacing:.1em}
      .bl,.br{bottom:16px;font-size:10px}
    }
    @media (max-width:480px){
      .bl{bottom:46px}
    }
  </style>
  <link rel="stylesheet" href="assets/css/specular-buttons.css" />
</head>
<body>
  <div class="home-reveal" id="homeReveal">
    <div class="gradient-ascii-bg" id="gradientAsciiBg" aria-hidden="true"></div>
    <div class="stroke-text-wrap" id="strokeText"></div>
    <div class="cursor-big" id="cursorBig"></div>

    <div class="tagline">
      <h1 class="tagline__title">Let imagination become visible reality.</h1>
      <p class="tagline__meta">AI Visual Designer | Interactive Art</p>
      <span class="specular-slot site-slot--enter">
        <span
          data-specular-button
          data-sb-id="enterBtn"
          data-sb-label="Enter →"
          data-sb-href="portfolio.html#about"
          data-sb-class="site-specular-button"
        ></span>
      </span>
    </div>

    <div class="menu"><i></i><i></i><i></i><i></i></div>
    <div class="bl">AI Visual Designer / Chengdu</div>
    <div class="br"><span>Portfolio</span><span>/</span><span>Films</span><span class="lang">CN</span></div>
  </div>

  <script src="assets/js/specular-buttons.iife.js"></script>
  <script>
  const cursorBig = document.getElementById('cursorBig');
  addEventListener('mousemove',e=>{
    cursorBig.style.left=e.clientX+'px'; cursorBig.style.top=e.clientY+'px';
  });
  const enterBtn = document.getElementById('enterBtn');
  enterBtn.addEventListener('mouseenter',()=>cursorBig.classList.add('hover'));
  enterBtn.addEventListener('mouseleave',()=>cursorBig.classList.remove('hover'));

  </script>
  <script src="assets/js/gradient-ascii.iife.js"></script>
  <script src="assets/js/stroketext.js"></script>
  <script>
    var strokeMounted = false;

    function mountHomeStroke() {
      if (strokeMounted) return;
      strokeMounted = true;
      StrokeTextEffect.mount(document.getElementById('strokeText'), {
        text: '个人简历',
        strokeColor: '#ffffff',
        strokeStyle: 'solid',
        strokeWidth: 1.4,
        dashLength: 10,
        drawDuration: 1.6,
        fillDelay: 0.2,
        stagger: 0.05,
        ease: 'power2.out',
        trigger: 'mount',
        fillMode: 'wipe',
        wipeFrom: 'left',
        fontSize: 112,
        fontWeight: 800,
        letterSpacing: -4,
        marching: false,
        hoverRedraw: true,
        shadow: false,
        fontFamily: 'Georgia, serif',
        reverse: false
      });
    }
  </script>
  <script>
    setTimeout(mountHomeStroke, 200);
  </script>
</body>
</html>
